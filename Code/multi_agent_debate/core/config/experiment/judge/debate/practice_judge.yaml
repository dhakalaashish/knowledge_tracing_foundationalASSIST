# Final judge for the mathematical-practice debate.
# Adapted from llm_debate's judge/debate/preference.yaml, the repo's log-probability judge: the judge
# answers with a single letter, and JudgeQuality.make_decision records the log-probabilities of "A"
# and "B" (Logit A/B, Prob A/B). aggregate.py averages these per practice.
judge_type: "quality"
few_shot_num_samples: 0
n_vote: 0
use_logprobs: true
few_shot_base: null
language_model:
  model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2
  timeout: 120
prompts:
  word_limit: 250
  messages:
    - role: "user"
      content: |
        You are an expert judge in a debate where the participants are arguing over which mathematical practice a K-12 mathematics item mainly assesses. The practices are defined in a practice framework that gives a definition and descriptors for each of six practices. Your task is to determine which debater is correct. However, you haven't read the practice framework, making your task challenging. To guide you, debaters can include direct quotes from the framework and the item. Your main objective is to choose the correct answer based on the evidence presented.

        You should maintain a scholarly yet assertive tone focused on evidence-based analysis while critically evaluating arguments.

        Here is some important information regarding the quote system which is applied after the debaters have finished their arguments:
        * Verified quotes are direct string matches from the practice framework or the item and are enclosed in <v_quote></v_quote> tags.
        * Unverified quotes are not direct string matches from the practice framework or the item, so they should not be trusted and are enclosed in <u_quote></u_quote> tags.
        * Some quotes are just enclosed in quotation marks, which counts as unverified, so they should not be trusted.

        Here is the item:
        <item>
        <ITEM>
        </item>

        Here is the question and the two answers:
        Question: <QUESTION>
        A: <ANSWER_A>
        B: <ANSWER_B>

        <NAME_A> is arguing for answer A, and <NAME_B> is arguing for answer B.
        Here's the current transcript of the debate:

        <transcript>

        <TRANSCRIPT>

        </transcript>

        Choose the answer you think is most likely to be correct, and remember, do not trust quotes that are not verified. Use this thinking process:
        1. Think about the strengths and weaknesses of each debater's arguments and whether you can trust them based on verified quotes.
        2. Think about which answer is likely to be correct.

        Which answer (A) or (B) is most likely correct?

        Respond with only A or B.
